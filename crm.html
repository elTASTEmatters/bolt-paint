<style>
/* CRM de seguimiento de cotizaciones · Bolt Paint. Lee la colección "pedidos" (tipo: cotizacion) y solo escribe campos crm*. */
:root{
  color-scheme:dark;
  --bg:#0c0b0a; --panel:#171513; --card:#211e1b; --line:#35302b;
  --fg:#faf5f2; --muted:#a89f97; --accent:#f47a00; --on-accent:#140b00;
  --navy:#6ea4e6; --ok:#58c483; --warn:#f2b441; --bad:#ef6b6b;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --label:"Archivo Black","Arial Black",sans-serif;
  --body:"Syne","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1500px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login form{background:var(--panel);border-top:4px solid var(--accent);border-radius:6px;padding:26px 22px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
.login h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;margin:0;text-transform:uppercase}
.login h1 span{color:var(--accent)}
.login p{margin:0;color:var(--muted)}
.login input{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:11px 12px;width:100%}
.login .err{color:var(--bad);min-height:1.3em;font-size:13.5px}

.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--accent);padding-bottom:14px}
.brand{min-width:0}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--muted)}
.who{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end}
.who div{min-width:0}
.lbl{font-family:var(--label);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block}
.who b{font-weight:600}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.conn.ok i{background:var(--ok)} .conn.err i{background:var(--bad)}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;padding:9px 14px;font-family:var(--label);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:11px}
.btn[disabled]{opacity:.6;cursor:default}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;min-width:0}
.kpi strong{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.alert strong{color:var(--warn)}

.tools{display:flex;flex-wrap:wrap;gap:10px}
.tools input,.tools select{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:9px 11px;min-width:0}
.tools input{flex:1 1 220px}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{flex:0 0 min(290px,82vw);background:var(--panel);border-radius:6px;display:flex;flex-direction:column;scroll-snap-align:start;border-top:4px solid var(--st)}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.colh{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.colh h2{font-family:var(--label);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0;display:flex;justify-content:space-between;gap:8px}
.colh h2 em{font-style:normal;color:var(--muted)}
.colh p{margin:5px 0 0;font-size:12.5px;color:var(--muted)}
.colh .sum{margin-top:6px;font-weight:700;font-variant-numeric:tabular-nums}
.cards{padding:10px;display:flex;flex-direction:column;gap:10px;min-height:90px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card .r1{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .name{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.card .desc{font-size:13px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .r3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .tot{font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums}
.tag{font-family:var(--label);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.due{font-size:12px;color:var(--muted)}
.due.late{color:var(--bad);font-weight:700}
.due.today{color:var(--warn);font-weight:700}
.cardwrap{display:flex;flex-direction:column;gap:4px}
.adv{align-self:flex-end;background:none;border:0;color:var(--accent);font-weight:700;font-size:12.5px;padding:2px 2px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--bg);border-left:3px solid var(--accent);z-index:6;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.drawer h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin:2px 0 0;text-transform:uppercase;overflow-wrap:anywhere}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.x{background:none;border:1px solid var(--line);border-radius:4px;padding:5px 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld input,.fld select,.fld textarea{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
.val{font-weight:600;overflow-wrap:anywhere}
.wa{color:var(--ok);font-weight:700}
.drawer table{width:100%;border-collapse:collapse;font-size:14px}
.drawer td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.drawer td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:12px}
.drawer tr.t td{border-bottom:0;font-weight:700;font-size:16px}
.drawer tr.neg td{color:var(--ok)}
.sec{display:flex;flex-direction:column;gap:8px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{background:var(--panel);border-radius:4px;padding:8px 10px;font-size:13.5px;overflow-wrap:anywhere}
.log time{display:block;font-size:11.5px;color:var(--muted)}
.addn{display:flex;gap:8px}
.addn input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.tools .btn{flex:0 0 auto}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:6px;flex:none}
.prods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.prods li{background:var(--panel);border-radius:4px;padding:8px 10px;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.prods li>div{min-width:0;overflow-wrap:anywhere}
.prods small{display:block;color:var(--muted);font-size:12.5px}
.prods .n{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.prods li{flex-direction:column;gap:6px}
.prods .ph{display:flex;justify-content:space-between;gap:10px}
.prods .ph>div{min-width:0;overflow-wrap:anywhere}
.prods .br{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--fg);border-top:1px dashed var(--line);padding-top:5px;font-variant-numeric:tabular-nums}
.prods .br span:first-child{min-width:0}
.prods .br em{font-style:normal;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fld .req{color:var(--accent)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 64px 104px 34px;gap:6px;align-items:center}
.prow input{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px 8px;width:100%;min-width:0}
.prow .rm{background:none;border:1px solid var(--line);border-radius:4px;height:36px;color:var(--muted)}
.phead{display:grid;grid-template-columns:minmax(0,1fr) 64px 104px 34px;gap:6px}
.ftot{display:flex;justify-content:space-between;font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:8px;font-variant-numeric:tabular-nums}
.ferr{color:var(--bad);font-size:13.5px;min-height:1.2em}
.factions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:4px;font-weight:600;z-index:9;max-width:calc(100% - 32px)}
  .bp-rc{background:#fff;color:#111;max-width:420px;width:100%;border-radius:12px;padding:24px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
  .bp-rc .bp-rch{text-align:center;margin-bottom:8px}.bp-rc .bp-rlogo{font-family:'Syne',sans-serif;font-weight:800;font-size:24px}.bp-rc .bp-rlogo em{color:#F47A00;font-style:normal}
  .bp-rc .bp-rsub{font-size:11px;color:#555}.bp-rc .bp-rtype{margin-top:8px;font-weight:600;letter-spacing:1px;background:#111;color:#fff;display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px}
  .bp-rc hr{border:none;border-top:1px dashed #999;margin:11px 0}
  .bp-rc .bp-rr{display:flex;justify-content:space-between;gap:10px}.bp-rc .bp-rr.bp-s{font-size:11px;color:#555}
  .bp-rc .bp-rit{margin:5px 0}.bp-rc .bp-rit .bp-l1{display:flex;justify-content:space-between;font-weight:600}.bp-rc .bp-rit .bp-l2{font-size:11px;color:#666}
  .bp-rc .bp-rtot{display:flex;justify-content:space-between;font-family:'Syne',sans-serif;font-weight:800;font-size:21px;margin-top:6px}.bp-rc .bp-rtot b{color:#F47A00}
  .bp-rc .bp-rfoot{text-align:center;font-size:11px;color:#555;margin-top:11px}
  .bp-rc .bp-sec{font-weight:700;font-size:11px;letter-spacing:.8px;text-transform:uppercase;margin:12px 0 5px;color:#F47A00}
  .bp-rc .bp-ck{display:flex;gap:7px;align-items:flex-start;margin:4px 0;font-size:11.5px;page-break-inside:avoid}
  .bp-rc .bp-ckb{width:12px;height:12px;border:1.5px solid #333;border-radius:3px;flex:none;margin-top:1px}
  .bp-rc .bp-ck small{display:block;color:#777;font-size:10px}
  .bp-rc table.bp-tv{width:100%;min-width:0;border-collapse:collapse;font-size:10.5px;margin-top:4px;page-break-inside:avoid}
  .bp-rc .bp-tv th,.bp-rc .bp-tv td{border:1px solid #ddd;padding:4px 5px;text-align:left;vertical-align:top;color:#111;background:#fff}
  .bp-rc .bp-tv th{background:#faf8f4;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px}
  .bp-rc .bp-gar{margin-top:12px;border:2px solid #F47A00;border-radius:10px;padding:12px;background:#FFFBF6;page-break-inside:avoid}
  .bp-rc .bp-gar h5{margin:0 0 5px;font-family:'Syne',sans-serif;font-size:13px}
  .bp-rc .bp-gar p,.bp-rc .bp-gar li{font-size:10.5px;line-height:1.5;margin:4px 0;color:#222}
  .bp-rc .bp-gar ul{margin:3px 0;padding-left:15px}
  .bp-rc .bp-sello{margin-top:12px;display:flex;justify-content:space-between;gap:10px}
  .bp-rc .bp-firma{border-top:1px solid #333;padding-top:3px;font-size:9.5px;color:#555;width:46%;text-align:center}
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm" autocomplete="off">
    <h1>Bolt <span>Paint</span> CRM</h1>
    <p>Seguimiento de cotizaciones</p>
    <input id="pwd" type="password" placeholder="Contraseña" aria-label="Contraseña">
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand">
      <h1>Bolt <span>Paint</span> · Seguimiento</h1>
      <p>Cada cotización que sale de la página cae aquí con su precio ya calculado.</p>
    </div>
    <div class="who">
      <div><span class="lbl">Usuario</span><b>Ignacio Pelayo</b> · Ventas y servicio al cliente</div>
      <div><span class="lbl">WhatsApp que recibe las cotizaciones</span><b>686 317 3475</b></div>
      <div><span class="conn" id="conn"><i></i><span id="connTxt">Conectando…</span></span></div>
      <button class="btn ghost sm" id="salir" type="button">Salir</button>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="Resumen"></section>

  <div class="tools">
    <input id="buscar" type="search" placeholder="Buscar cliente, folio o teléfono" aria-label="Buscar">
    <select id="filtro" aria-label="Tipo de cotización"><option value="">Todos los tipos</option></select>
    <button class="btn" id="nuevo" type="button">+ Agregar cliente</button>

  <datalist id="conceptos"></datalist>

  <main class="board" id="board" aria-label="Pipeline de cotizaciones"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Detalle de la cotización"></aside>
<div class="toast" id="toast" hidden role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD44dk4huRpzmbrmeLMrldBmvunh_K7o24",
  authDomain: "bolt-paint.firebaseapp.com",
  projectId: "bolt-paint",
  storageBucket: "bolt-paint.firebasestorage.app",
  messagingSenderId: "251872983332",
  appId: "1:251872983332:web:3ab2eb0f8bf17838715bb1"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.BP = {
  listen(cb, err){
    const q = query(collection(db,"pedidos"), orderBy("createdAt","desc"));
    return onSnapshot(q, s=>{const a=[];s.forEach(d=>a.push({fbId:d.id,...d.data()}));cb(a);}, err);
  },
  update(fbId, updates){ return updateDoc(doc(db,"pedidos",fbId), updates); },
  add(p){ return addDoc(collection(db,"pedidos"), {...p, createdAt: serverTimestamp()}).then(r=>r.id); }
};
window.dispatchEvent(new Event('bp-ready'));
</script>

function productos(o){
  var L=[];
  (Array.isArray(o.paints)?o.paints:[]).forEach(function(p){L.push({h:p.h,t:'Pintura '+(p.n||''),d:[p.area?p.area+' m²':'',pres(p)].filter(Boolean).join(' · '),c:p.cost,br:desglose(p,p.n)})});
  (Array.isArray(o.impermeabilizantes)?o.impermeabilizantes:[]).forEach(function(i){L.push({h:i.hex,t:'Impermeabilizante '+(i.color||'')+(i.tela?' con tela':' sin tela'),d:[i.area?i.area+' m²':'',pres(i)].filter(Boolean).join(' · '),c:i.cost,br:desglose(i,null)})});
  (Array.isArray(o.igualaciones)?o.igualaciones:[]).forEach(function(g){L.push({h:g.color,t:'Igualación de color '+(g.name||''),d:[g.brand,g.code,g.type,g.loc,g.uses,g.dur,g.notes].filter(Boolean).join(' · '),c:null})});
  var fr=o.fraccionamiento;
  if(fr&&Array.isArray(fr.modelos))fr.modelos.forEach(function(m){L.push({h:'',t:'Modelo '+(m.name||'sin nombre')+' × '+(m.qty||1)+' vivienda'+((m.qty||1)>1?'s':''),d:'Lote '+(m.f||0)+' × '+(m.d||0)+' m · '+(m.lv||1)+' nivel'+((m.lv||1)>1?'es':''),c:null})});
  return L;
}
function resumen(o){
  var P=productos(o).filter(function(p){return !/^Modelo /.test(p.t)});
  if(P.length)return P.map(function(p){return p.t+(p.d?' ('+p.d+')':'')}).join(' · ');
  var it=(o.items||[]).filter(function(i){return (Number(i.pr)||0)>=0}).map(function(i){return ((Number(i.qty)||1)>1?i.qty+'× ':'')+i.nombre});
  return it.join(' · ')||o.notas||'';
}
function notasCrm(o){return Array.isArray(o.crmNotas)?o.crmNotas:[]}
function dueInfo(o){
  if(!o.crmProx||OPEN.indexOf(etapa(o))<0)return null;
  var t=day(0);
  if(o.crmProx<t)return {c:'late',t:'Seguimiento vencido · '+fmtDate(o.crmProx)};
  if(o.crmProx===t)return {c:'today',t:'Seguimiento hoy'};
  return {c:'',t:'Seguimiento '+fmtDate(o.crmProx)};
}
function waLink(o){
  var d=String(o.telefono||'').replace(/\D/g,'');if(d.length<10)return '';
  if(d.length===10)d='52'+d;
  return 'https://wa.me/'+d+'?text='+encodeURIComponent('Hola, soy Ignacio Pelayo de Bolt Paint. Le doy seguimiento a su cotización '+(o.id||'')+'.');
}

function visible(){
  var s=q.trim().toLowerCase();
  return data.filter(function(o){
    if(ft&&tipo(o)!==ft)return false;
    if(!s)return true;
    return [o.nombre,o.id,o.telefono,o.direccion].join(' ').toLowerCase().indexOf(s)>=0;
  });
}
function renderKpis(){
  var open=data.filter(function(o){return OPEN.indexOf(etapa(o))>=0});
  var t=day(0);
  var sinC=data.filter(function(o){return etapa(o)==='nueva'}).length;
  var venc=open.filter(function(o){return o.crmProx&&o.crmProx<=t}).length;
  var gan=data.filter(function(o){return etapa(o)==='ganada'});
  var cerr=gan.length+data.filter(function(o){return etapa(o)==='perdida'}).length;
  var k=[
    ['Cotizaciones abiertas',open.length,''],
    ['Monto abierto',money(open.reduce(function(s,o){return s+total(o)},0)),''],
    ['Sin contactar',sinC,sinC?'alert':''],
    ['Seguimientos para hoy o vencidos',venc,venc?'alert':''],
    ['Ganadas',gan.length+' · '+money(gan.reduce(function(s,o){return s+total(o)},0)),''],
    ['Cierre',cerr?Math.round(gan.length/cerr*100)+' %':'—','']
  ];
  $('kpis').innerHTML=k.map(function(x){return '<div class="kpi '+x[2]+'"><span class="lbl">'+x[0]+'</span><strong>'+x[1]+'</strong></div>'}).join('');
  document.title=(sinC?'('+sinC+') ':'')+'Bolt Paint CRM';
}
function renderFiltro(){
  var seen={},opts=['<option value="">Todos los tipos</option>'];
  data.forEach(function(o){seen[tipo(o)]=1});
  Object.keys(seen).sort().forEach(function(t){opts.push('<option'+(t===ft?' selected':'')+'>'+esc(t)+'</option>')});
  if(ft&&!seen[ft])ft='';
  $('filtro').innerHTML=opts.join('');
}
function renderBoard(){
  var vis=visible();
  $('board').innerHTML=STAGES.map(function(st,si){
    var list=vis.filter(function(o){return etapa(o)===st.id});
    if(OPEN.indexOf(st.id)>=0)list.sort(function(a,b){return (a.crmProx||'9')<(b.crmProx||'9')?-1:(a.crmProx||'9')>(b.crmProx||'9')?1:0});
    var sum=list.reduce(function(s,o){return s+total(o)},0);
    var cards=list.map(function(o){
      var du=dueInfo(o), next=OPEN.indexOf(st.id)>=0?STAGES[si+1]:null;
      return '<div class="cardwrap"><button type="button" class="card" draggable="true" data-id="'+esc(o.fbId)+'">'+
        '<span class="r1"><span>'+esc(o.id||'')+'</span><span>'+fmtDate(fechaIso(o))+'</span></span>'+
        '<span class="name">'+esc(o.nombre||'(sin nombre)')+'</span>'+
        '<span class="tag">'+esc(tipo(o))+(o.origen==='manual'?' · agregado por Ignacio':'')+'</span>'+
        '<span class="desc">'+esc(resumen(o))+'</span>'+
        '<span class="r3"><span class="tot">'+money(total(o))+'</span>'+
        (du?'<span class="due '+du.c+'">'+du.t+'</span>':(st.id==='perdida'&&o.crmMotivo?'<span class="due">'+esc(o.crmMotivo)+'</span>':''))+'</span>'+
        '</button>'+(next?'<button type="button" class="adv" data-adv="'+esc(o.fbId)+'">Pasar a '+next.n+' →</button>':'')+'</div>';
    }).join('');
    return '<section class="col" style="--st:'+st.c+'" data-stage="'+st.id+'">'+
      '<div class="colh"><h2>'+st.n+' <em>'+list.length+'</em></h2><p>'+st.d+'</p><div class="sum">'+money(sum)+'</div></div>'+
      '<div class="cards">'+(cards||'<div class="empty">Sin cotizaciones en esta etapa</div>')+'</div></section>';
  }).join('');
}

   '<div class="grid2">'+
     '<div class="fld"><span class="lbl">WhatsApp del cliente</span><span class="val">'+esc(o.telefono||'—')+'</span>'+(wa?'<a class="wa" href="'+esc(wa)+'" target="_blank" rel="noopener">Abrir chat de WhatsApp</a>':'')+'</div>'+

       :(OPEN.indexOf(et)>=0?'<label class="fld"><span class="lbl">Próximo seguimiento</span><input type="date" id="d-prox" value="'+esc(o.crmProx||'')+'"></label>':''))+
   '</div>'+

     (extra.length?'<div>'+extra.map(esc).join('<br>')+'</div>':'')+
     (prods.length?'<ul class="prods">'+prods.map(function(p){return '<li><div class="ph"><div>'+swatch(p.h)+'<b>'+esc(p.t)+'</b>'+(p.d?'<small>'+esc(p.d)+'</small>':'')+'</div><span class="n">'+(p.c==null?'':p.c>0?money(p.c):'por cotizar')+'</span></div>'+(p.br||[]).map(function(b){return '<div class="br"><span>'+esc(b.t)+(b.pu?' <em>· '+money(b.pu)+' c/u</em>':'')+'</span><span>'+(b.imp!=null?money(b.imp):'')+'</span></div>'}).join('')+'</li>'}).join('')+'</ul><span class="lbl">'+(hayDet?'Otros conceptos y total':'Partidas y total')+'</span>':'')+

/* ---- Escritura: solo campos crm* del pedido ---- */
function guardar(o,upd,okMsg){
  upd.crmAct=new Date().toISOString();
  return window.BP.update(o.fbId,upd).then(function(){if(okMsg)toast(okMsg)}).catch(function(e){console.error(e);toast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.')});
}
function move(o,st){
  if(!o||STAGE_IDS.indexOf(st)<0||etapa(o)===st)return;
  var name=STAGES[STAGE_IDS.indexOf(st)].n;
  var upd={crmEtapa:st,crmNotas:notasCrm(o).concat([{f:day(0),t:'Movida a '+name+'.'}])};
  if(OPEN.indexOf(st)<0)upd.crmProx='';
  else if(!o.crmProx||o.crmProx<day(0))upd.crmProx=day(1);
  if(st!=='perdida')upd.crmMotivo='';
  guardar(o,upd,(o.id||'Cotización')+' pasó a '+name);
}
function descargarPdf(o,btn){
  if(!o||!o.docHTML)return;
  btn.disabled=true;btn.textContent='Generando PDF…';
  var done=function(msg){btn.disabled=false;btn.textContent='Descargar el PDF del cliente';if(msg)toast(msg)};
  var run=function(){
    var host=document.createElement('div');
    host.style.cssText='position:absolute;left:-10000px;top:0;width:440px;background:#fff;z-index:-1';
    host.innerHTML='<div class="bp-rc">'+o.docHTML+'</div>';
    document.body.appendChild(host);
    window.html2pdf().set({margin:[10,12,12,12],filename:'Cotizacion-'+(o.id||'bolt')+'.pdf',image:{type:'jpeg',quality:0.95},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0,windowWidth:document.documentElement.clientWidth},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}
    }).from(host.firstChild).save().then(function(){host.remove();done('PDF descargado')}).catch(function(e){console.error(e);host.remove();done('No se pudo generar el PDF')});
  };
  if(window.html2pdf){run();return}
  var sc=document.createElement('script');sc.src='html2pdf.bundle.min.js';sc.onload=run;sc.onerror=function(){done('No se pudo cargar el generador de PDF')};document.head.appendChild(sc);
}

function opts(list,v){return list.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
function prowHTML(it){
  it=it||{};

function readItems(){

}

function saveForm(){
  var nombre=$('f-nombre').value.trim(),tel=$('f-tel').value.trim(),err=$('f-err');
  if(nombre.length<3){err.textContent='Escribe el nombre del cliente o de la empresa.';$('f-nombre').focus();return}
  if(tel.replace(/\D/g,'').length<10){err.textContent='Escribe un WhatsApp de 10 dígitos.';$('f-tel').focus();return}
  var items=readItems(),tot=Math.round(updTotal()),editId=$('drawer').dataset.edit;
  var base={nombre:nombre,telefono:tel,direccion:$('f-dir').value.trim(),modo:$('f-tipo').value,canal:$('f-canal').value,items:items,total:tot};
  var btn=$('f-save');btn.disabled=true;err.textContent='';
  if(editId){
    var o=byId(editId);
    base.crmAct=new Date().toISOString();
    base.crmNotas=notasCrm(o||{}).concat([{f:day(0),t:'Datos o partidas editados.'}]);
    window.BP.update(editId,base).then(function(){toast('Cambios guardados');sel=editId;closeForm()}).catch(function(e){console.error(e);btn.disabled=false;err.textContent='No se pudo guardar. Revisa tu conexión e intenta de nuevo.'});
    return;
  }
  var nota=$('f-nota').value.trim(),notas=[{f:day(0),t:'Cliente agregado a mano por Ignacio ('+base.canal+').'}];
  if(nota)notas.push({f:day(0),t:nota});
  var p=Object.assign(base,{id:folioMan(),tipo:'cotizacion',origen:'manual',fecha:new Date().toLocaleDateString('es-MX'),status:'nueva',pago:'Cotización (por definir)',
    notas:'Cliente directo · '+base.canal,crmEtapa:$('f-etapa').value,crmProx:$('f-prox').value,crmMotivo:'',crmNotas:notas,crmAct:new Date().toISOString()});
  window.BP.add(p).then(function(id){toast(p.id+' agregado al pipeline');sel=id;closeForm()}).catch(function(e){console.error(e);btn.disabled=false;err.textContent='No se pudo guardar. Revisa tu conexión e intenta de nuevo.'});
}

    if(e.target.id==='f-cancel'||e.target.id==='f-cancel2')closeForm();
    if(e.target.id==='f-addrow'){$('f-rows').insertAdjacentHTML('beforeend',prowHTML());var r=$('f-rows').lastElementChild;r.querySelector('.p-n').focus()}
    if(e.target.classList.contains('rm')){var rows=$('f-rows');if(rows.children.length>1)e.target.closest('.prow').remove();else e.target.closest('.prow').querySelectorAll('input').forEach(function(i){i.value=i.classList.contains('p-q')?'1':''});updTotal()}
    return;
  }
  if(e.target.id==='cerrar'){sel=null;renderDrawer()}
  if(e.target.id==='d-pdf')descargarPdf(byId(sel),e.target);
  if(e.target.id==='d-edit')openForm(byId(sel));
});
drawer.addEventListener('input',function(e){
  if(!formOpen)return;
  if($('f-err'))$('f-err').textContent='';
  if(e.target.classList.contains('p-n')){var c=CONCEPTOS.filter(function(x){return x[0]===e.target.value})[0],pp=e.target.closest('.prow').querySelector('.p-p');if(c&&c[1]&&!pp.value)pp.value=c[1]}
  if(e.target.closest('.prow'))updTotal();
});
drawer.addEventListener('change',function(e){
  if(formOpen)return;
  var o=byId(sel);if(!o)return;
  if(e.target.id==='d-etapa')move(o,e.target.value);
  if(e.target.id==='d-prox')guardar(o,{crmProx:e.target.value},'Seguimiento agendado');
  if(e.target.id==='d-motivo')guardar(o,{crmMotivo:e.target.value},'Motivo guardado');
});
drawer.addEventListener('submit',function(e){
  e.preventDefault();
  if(formOpen){saveForm();return}var o=byId(sel),inp=$('d-nota'),v=inp.value.trim();if(!o||!v)return;
  inp.value='';
  guardar(o,{crmNotas:notasCrm(o).concat([{f:day(0),t:v}])},'Nota guardada');
});
$('scrim').addEventListener('click',function(){if(formOpen){closeForm();return}sel=null;renderDrawer()});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(formOpen){closeForm();return}if(sel){sel=null;renderDrawer()}});
$('buscar').addEventListener('input',function(e){q=e.target.value;renderBoard()});
$('filtro').addEventListener('change',function(e){ft=e.target.value;renderBoard()});

/* ---- Acceso ---- */
function sha256(t){
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')});
}
function boot(){
  $('login').hidden=true;$('app').hidden=false;
  var start=function(){
    if(unsub)return;
    unsub=window.BP.listen(function(list){
      data=list.filter(function(o){return o.tipo==='cotizacion'&&!o.archivado});
      setConn('ok','Conectado · '+data.length+' cotizaciones');render();
    },function(err){console.error(err);setConn('err','Sin conexión');toast('No se pudo conectar con la base de datos')});
  };
  if(window.BP)start();else window.addEventListener('bp-ready',start,{once:true});
}
$('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  sha256($('pwd').value).then(function(h){
    if(h===PASS_HASH){try{localStorage.setItem(LS_KEY,h)}catch(x){}$('loginErr').textContent='';boot()}
    else{$('loginErr').textContent='Contraseña incorrecta';$('pwd').value='';$('pwd').focus()}
  }).catch(function(){$('loginErr').textContent='Este navegador no permite verificar la contraseña. Abre la página con https.'});
});
$('salir').addEventListener('click',function(){
  try{localStorage.removeItem(LS_KEY)}catch(x){}
  if(unsub){unsub();unsub=null}
  data=[];sel=null;formOpen=false;renderDrawer();$('app').hidden=true;$('login').hidden=false;$('pwd').value='';
});
var saved=null;try{saved=localStorage.getItem(LS_KEY)}catch(x){}
if(saved&&saved===PASS_HASH)boot();
})();
</script>
